{% extends 'base.html' %}

{% block page_title %}Data Kriteria{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1a5276, #2e86c1);">
        <h5 class="text-white mb-0"><i class="fas fa-list-check me-2"></i>Data Kriteria</h5>
        <a href="{{ url_for('tambah_kriteria') }}" class="btn btn-light btn-sm">
            <i class="fas fa-plus me-1"></i>Tambah Kriteria
        </a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Kriteria</th>
                        <th>Bobot</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody>
                    {% for k in data %}
                    <tr>
                        <td>{{ loop.index }}</td>
                        <td><strong>{{ k.nama }}</strong></td>
                        <td>{{ k.bobot }}</td>
                        <td>
                            <a href="{{ url_for('ubah_kriteria', id=k.id) }}" class="btn btn-warning btn-sm">
                                <i class="fas fa-edit"></i>
                            </a>
                            <a href="{{ url_for('hapus_kriteria', id=k.id) }}" class="btn btn-danger btn-sm"
                               onclick="return confirm('Yakin ingin menghapus?')">
                                <i class="fas fa-trash"></i>
                            </a>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center text-muted py-4">
                            <i class="fas fa-inbox fa-2x mb-2 d-block"></i>
                            Belum ada data kriteria
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
