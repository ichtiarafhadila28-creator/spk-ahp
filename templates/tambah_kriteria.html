{% extends 'base.html' %}

{% block page_title %}Tambah Kriteria{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header" style="background: linear-gradient(135deg, #1a5276, #2e86c1);">
        <h5 class="text-white mb-0"><i class="fas fa-plus me-2"></i>Tambah Kriteria</h5>
    </div>
    <div class="card-body p-4">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Nama Kriteria</label>
                <input type="text" name="nama" class="form-control" placeholder="Contoh: Produktivitas" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Bobot <small class="text-muted">(0 - 1)</small></label>
                <input type="number" step="0.01" min="0" max="1" name="bobot" class="form-control" placeholder="Contoh: 0.3" required>
                <div class="form-text">Total bobot semua kriteria sebaiknya = 1</div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-2"></i>Simpan
                </button>
                <a href="{{ url_for('kriteria') }}" class="btn btn-secondary">
                    <i class="fas fa-arrow-left me-2"></i>Kembali
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
